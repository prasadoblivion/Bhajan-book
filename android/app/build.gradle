plugins { id 'com.android.application' }

android {
    namespace 'com.prasadoblivion.bhajanbook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.prasadoblivion.bhajanbook'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    sourceSets {
        main {
            res.srcDir(layout.buildDirectory.dir("generated/res/omLauncher"))
        }
    }
}

def prepareOmLauncher = tasks.register("prepareOmLauncher", Copy) {
    from("src/main/assets/images/om.png")
    into(layout.buildDirectory.dir("generated/res/omLauncher/drawable-nodpi"))
    rename { "om_launcher.png" }
}

tasks.named("preBuild").configure {
    dependsOn(prepareOmLauncher)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
}
