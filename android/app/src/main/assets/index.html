<!doctype html>
<html lang="mr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
		<meta name="theme-color" content="#7c3f1d" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Bhajan Book" />
		<meta name="description" content="A peaceful, offline-ready Marathi devotional bhajan and aarti book." />
		<link rel="manifest" href="manifest.json" />
		<link rel="stylesheet" href="css/app.css" />
		<title>Bhajan Book</title>
	</head>
	<body>
		<header class="top">
			<div class="logo" aria-hidden="true">ॐ</div>
			<div>
				<div class="brand">Bhajan Book</div>
				<div class="sub">आरती • भजन • प्रार्थना</div>
			</div>
			<button class="topHome" id="homeBtn" type="button" aria-label="Go to bhajan list" title="Bhajan list">⌂</button>
		</header>
		<main>
			<section id="listView" class="view active">
				<div class="hero" role="img" aria-label="Lord Ganesha seated among lotus flowers">
					<h1 class="visuallyHidden">Bhajans, aartis and prayers</h1>
				</div>
				<div class="collectionBar">
					<div id="versionTabs" class="versionTabs" role="tablist" aria-label="Bhajan collection version"></div>
					<label class="search">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
							<circle cx="11" cy="11" r="7"></circle>
							<path d="m20 20-4-4"></path>
						</svg>
						<input id="search" type="search" placeholder="Search by title" autocomplete="off" aria-label="Search bhajans" />
					</label>
				</div>
				<div class="sectionHead">
					<h2 id="collectionName">Current collection</h2>
					<span id="collectionCount" class="collectionCount" aria-live="polite"></span>
				</div>
				<div id="grid" class="grid"></div>
			</section>
			<section id="readerView" class="view">
				<div class="reader">
					<div class="readerTop">
						<button class="btn" id="backBtn" type="button">← All Bhajans</button>
						<span id="count" class="count"></span>
					</div>
					<div class="readerLayout">
						<div id="readerArt" class="readerArt" aria-hidden="true"></div>
						<div class="panel">
							<div class="content">
								<div class="invocation" aria-hidden="true">॥ श्री ॥</div>
								<h2 id="rtitle"></h2>
								<div id="rmeta" class="meta"></div>
								<div id="lyrics" class="lyrics"></div>
							</div>
						</div>
					</div>
					<div class="nav">
						<div class="navrow">
							<button id="prevBtn" type="button">← Previous</button>
							<button id="nextBtn" class="next" type="button">Next Bhajan →</button>
							<button id="listBtn" type="button">☰ List</button>
						</div>
						<div class="hint">Swipe left/right on the lyrics • Keyboard ← / → also works</div>
					</div>
				</div>
			</section>
		</main>
		<footer class="appFooter">
			<span class="devName">Developed by Prasad Dasanatti</span>
			· <a href="mailto:prasad.dasanatti@gmail.com">prasad.dasanatti@gmail.com</a>
		</footer>
		<script src="js/bhajans.js"></script>
		<script src="js/ui.js"></script>
		<script src="js/navigation.js"></script>
		<script src="js/app.js"></script>
	</body>
</html>
